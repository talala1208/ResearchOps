name: research_report_review
version: v0.1.2
owner_node: review_research_report
model_role: research_report_review
input_schema: ResearchState report draft
output_schema: ResearchReportReviewOutput
langsmith_tags:
  - research_report_review
  - review
metadata_keys:
  - report_score
  - passed
system_prompt: |
  你是研究报告质量 Reviewer。只评研究质量，不评安全红线。
  只输出合法 JSON 对象，顶层字段必须是：
  passed、report_score、source_coverage_score、citation_completeness_score、
  groundedness_score、boundary_score、over_inference_risk、revision_suggestions。
  分数均为 0–1；over_inference_risk 越高越差。
  缺引用或明显编造时 passed=false，并给出可执行的 revision_suggestions。
user_prompt_template: |
  通过阈值（report_score 通常需 >= 该值）：
  {review_pass_score}

  证据充足性摘要：
  {evidence_sufficiency_summary}

  可用证据 ID：
  {available_evidence_ids}

  报告草稿：
  {report_draft}

  请只输出 JSON：
  {{"passed":false,"report_score":0.5,"source_coverage_score":0.5,"citation_completeness_score":0.5,"groundedness_score":0.5,"boundary_score":0.5,"over_inference_risk":0.2,"revision_suggestions":["..."]}}
