name: structured_sql_tool
version: v0.1.0
owner_node: query_structured_data
model_role: deterministic_tool
input_schema: SearchTask.query
output_schema: structured_data_results
langsmith_tags:
  - structured_sql_tool
  - structured_mock
metadata_keys:
  - matched_product_count
system_prompt: |
  这是 ResearchOps Agent 的结构化 SQLite mock 数据工具配置。
  当前工具不调用 LLM，只使用代码执行参数化 SQL 查询。
  数据来自 data/mock/ai_products.json，并初始化到 data/mock/ai_products.sqlite。
  查询结果只能作为本地 mock 结构化资料，不代表真实市场事实。
user_prompt_template: |
  query: {query}
tool_description: 查询本地 AI 产品结构化 mock 数据。
no_match_message: 未在本地结构化 mock 数据中找到匹配产品。
result_line_template: "{name}｜{category}｜{pricing}｜{features}"
snippet_template: "{name} 是 {category}。价格信息：{pricing}。核心功能：{features}。目标用户：{target_users}。竞品：{competitors}。"
