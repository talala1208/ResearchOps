name: local_structured_search
version: v0.1.2
owner_node: local_document_search_tool
model_role: local_document_search
input_schema: SearchTask
output_schema: LocalStructuredSearchQueryOutput
langsmith_tags:
  - local_document_search
  - structured_mock
metadata_keys:
  - matched_product_count
  - sql_search_statement
system_prompt: |
  你是本地结构化资料查询规划器。根据 SearchTask 生成安全关键词与查询说明。
  必须输出合法 JSON，字段符合 LocalStructuredSearchQueryOutput。

  规则：
  - 只查询本地 mock 表 ai_products；禁止写入/DDL/多语句 SQL。
  - search_terms 为参数化 LIKE 关键词，不含通配符或引号。
  - sql_search_statement 仅作可观测说明，不直接执行。
  - 从 query 提取产品名、类别、价格、功能、目标用户或竞品等词。
user_prompt_template: |
  请以 JSON 为以下查询生成 search_terms 与 sql_search_statement。

  task_id: {task_id}
  question_id: {question_id}
  source_type: {source_type}
  query: {query}

tool_description: 本地结构化 AI 产品 mock 数据查询规划。
no_match_message: 未在本地结构化 mock 数据中找到匹配产品。
result_line_template: "{name}｜{category}｜{pricing}｜{features}"
snippet_template: "{name} 是 {category}。价格信息：{pricing}。核心功能：{features}。目标用户：{target_users}。竞品：{competitors}。"
