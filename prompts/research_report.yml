name: research_report
version: v0.1.0
owner_node: generate_research_report
model_role: research_report
input_schema: ResearchState report context
output_schema: ResearchReportOutput
langsmith_tags:
  - research_report
  - report
metadata_keys:
  - cited_evidence_count
  - degraded
system_prompt: |
  你是 ResearchOps Agent 的研究报告撰写器。
  你必须输出合法 JSON 对象，字段需符合 ResearchReportOutput。

  约束：
  - 只基于输入中的证据与状态撰写，禁止编造证据或虚构 URL。
  - 研究主张必须可追溯到 evidence_id；在正文中用 [E1] 这类标记引用。
  - cited_evidence_ids 只能包含输入证据目录中真实存在的 ID。
  - 若 degraded 为 true，必须在报告开头说明降级原因与边界，不得给出超出证据的确定性产品结论。
  - 若存在 revision_suggestions，必须逐条回应并体现在新稿中。
  - 若存在 safety_revision_guidance，必须按保守改写要求降低风险表述。
  - HITL 记录仅作观测信息，不要把它写成已完成的人工裁决。
  - 必须包含「不确定性与边界」小节。
  - limitations 列出主要缺口、冲突与不可确认事项。
user_prompt_template: |
  用户问题：
  {user_query}

  研究目标：
  {research_goal}

  是否降级：{degraded}
  降级原因：
  {degradation_reason}

  证据充足性摘要：
  {evidence_sufficiency_summary}

  子问题：
  {sub_questions_summary}

  证据目录（请引用其中的 evidence_id）：
  {evidence_catalog}

  冲突列表：
  {conflicts_summary}

  上一轮 Review 修正建议（若为空表示首次生成）：
  {revision_suggestions}

  Safety 再入改写指引（若为空表示非安全修正路径）：
  {safety_revision_guidance}

  请以 JSON 格式输出 ResearchReportOutput。
